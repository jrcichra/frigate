name: jrcichra build

# Every branch builds images tagged with the branch name (slashes become dashes):
#   ghcr.io/jrcichra/frigate:<branch>                 amd64
#   ghcr.io/jrcichra/frigate:<branch>-tensorrt-jp6    arm64 Jetson (Orin)
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version file
        run: make version

      - name: Branch tag
        id: tag
        run: echo "name=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/main/Dockerfile
          push: true
          platforms: linux/amd64
          target: frigate
          tags: ghcr.io/jrcichra/frigate:${{ steps.tag.outputs.name }}
          cache-from: type=registry,ref=ghcr.io/jrcichra/frigate:buildcache
          cache-to: type=registry,ref=ghcr.io/jrcichra/frigate:buildcache,mode=max

  jetson_jp6:
    name: Jetson JP6 arm64 image (Orin)
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Branch tag
        id: tag
        run: echo "name=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU and Buildx
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TensorRT (Jetson, Jetpack 6)
        env:
          ARCH: arm64
          BASE_IMAGE: nvcr.io/nvidia/tensorrt:23.12-py3-igpu
          SLIM_BASE: nvcr.io/nvidia/tensorrt:23.12-py3-igpu
          TRT_BASE: nvcr.io/nvidia/tensorrt:23.12-py3-igpu
        uses: docker/bake-action@v6
        with:
          source: .
          push: true
          targets: tensorrt
          files: docker/tensorrt/trt.hcl
          set: |
            tensorrt.tags=ghcr.io/jrcichra/frigate:${{ steps.tag.outputs.name }}-tensorrt-jp6
            *.cache-from=type=registry,ref=ghcr.io/jrcichra/frigate:buildcache-jp6
            *.cache-to=type=registry,ref=ghcr.io/jrcichra/frigate:buildcache-jp6,mode=max
