name: jrcichra build

on:
  push:
    branches:
      - jrcichra-patches
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version file
        run: make version

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/main/Dockerfile
          push: true
          platforms: linux/amd64
          target: frigate
          tags: ghcr.io/jrcichra/frigate:jrcichra-patches
          cache-from: type=registry,ref=ghcr.io/jrcichra/frigate:buildcache
          cache-to: type=registry,ref=ghcr.io/jrcichra/frigate:buildcache,mode=max
